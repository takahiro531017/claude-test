# 修理品管理システム(repair-tracker/)のCI。repair-tracker 配下の変更時のみ実行。
# ※ repair-tracker を単独リポジトリに移す場合は、このファイルを .github/workflows/ に置き、
#    paths と working-directory を削除してください。
name: repair-tracker CI
on:
  push:
    paths: ['repair-tracker/**', '.github/workflows/repair-tracker-ci.yml']
  pull_request:
    paths: ['repair-tracker/**', '.github/workflows/repair-tracker-ci.yml']

permissions:
  contents: read

defaults:
  run:
    working-directory: repair-tracker

jobs:
  app:
    name: Lint / 型チェック / 単体テスト / ビルド
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: repair-tracker/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-dummy-anon-key
      - name: 依存パッケージの脆弱性(本番依存・high 以上)
        run: npm audit --omit=dev --audit-level=high

  db:
    name: DBマイグレーション / RLS・監査ログのテスト
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci-only-password }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/db-test.sh
      - name: ダミーシードが投入できること
        run: |
          psql -v ON_ERROR_STOP=1 -q -d repair_test -f supabase/seed/seed_dummy.sql
          psql -d repair_test -tA -c "select count(*) from repairs" | grep -qx 30

  e2e:
    name: E2E(主要フロー・バックエンドはモック)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: repair-tracker/package-lock.json }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: repair-tracker/playwright-report, retention-days: 7 }

  secrets:
    name: シークレット混入チェック
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: . } }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --no-banner --redact

<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ダッシュボード | 在庫管理システム</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header" id="app-header"></header>
  <main class="container">
    <h1>ダッシュボード</h1>
    <p class="subtitle">現在の在庫状況を商品ごとに一覧表示します。</p>

    <div class="stat-grid" id="stats"></div>

    <div class="card">
      <div class="toolbar">
        <input id="search" type="search" placeholder="品番・商品名で検索" style="min-width:240px" />
        <label style="display:flex;align-items:center;gap:6px;font-weight:400;margin:0">
          <input id="lowOnly" type="checkbox" style="width:auto" />
          在庫僅少・欠品のみ表示
        </label>
      </div>
      <div id="message"></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>品番</th>
              <th>商品名</th>
              <th class="text-right">在庫数</th>
              <th class="text-right">在庫閾値</th>
              <th>状態</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </main>
  <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
